# This fork deploys through the Cloudflare Pages Git integration (project heather-wolfe-art-cred); this workflow only
# runs when the CF_PAGES_PROJECT secret is set.
name: Deploy to Cloudflare Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: cf-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CF_PAGES_PROJECT: ${{ secrets.CF_PAGES_PROJECT }}
    steps:
      - if: env.CF_PAGES_PROJECT != ''
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # tags, for /v/ builds
      - if: env.CF_PAGES_PROJECT != ''
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - if: env.CF_PAGES_PROJECT != ''
        name: Export the committed files and add the /v/ releases
        run: sh package/tools/export-site.sh _publish
      - if: env.CF_PAGES_PROJECT != ''
        name: Deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy _publish --project-name "${{ secrets.CF_PAGES_PROJECT }}" --branch main
